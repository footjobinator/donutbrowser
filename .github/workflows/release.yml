name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  STABLE_RELEASE: "true"

jobs:
  release:
    if: github.repository == 'footjobinator/donutbrowser'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 #v6.1.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 #master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 #v2.9.2
        with:
          workdir: ./src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          NEXT_PUBLIC_TURNSTILE: ${{ secrets.NEXT_PUBLIC_TURNSTILE }}
        run: pnpm build

      - name: Verify frontend dist exists
        shell: bash
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html not found after build"
            ls -la dist 2>/dev/null || ls -la
            exit 1
          fi
          echo "Frontend dist verified at $(pwd)/dist"

      - name: Build Tauri app
        env:
          NEXT_PUBLIC_TURNSTILE: ${{ secrets.NEXT_PUBLIC_TURNSTILE }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Build sidecar binaries
        shell: bash
        working-directory: ./src-tauri
        run: |
          cargo build --bin donut-proxy --target x86_64-pc-windows-msvc --release

      - name: Create portable Windows ZIP
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PORTABLE_DIR="Donut-Portable"
          mkdir -p "$PORTABLE_DIR"

          cp "src-tauri/target/x86_64-pc-windows-msvc/release/donutbrowser.exe" "$PORTABLE_DIR/Donut.exe"
          cp "src-tauri/target/x86_64-pc-windows-msvc/release/donut-proxy.exe" "$PORTABLE_DIR/"
          cp "src-tauri/binaries/xray-x86_64-pc-windows-msvc.exe" "$PORTABLE_DIR/xray.exe"

          mkdir -p "$PORTABLE_DIR/licenses"
          cp "src-tauri/binaries/xray-LICENSE.txt" "$PORTABLE_DIR/licenses/Xray-core-LICENSE.txt"

          if [ -f "src-tauri/target/x86_64-pc-windows-msvc/release/donut-daemon.exe" ]; then
            cp "src-tauri/target/x86_64-pc-windows-msvc/release/donut-daemon.exe" "$PORTABLE_DIR/"
          fi

          if [ -f "src-tauri/target/x86_64-pc-windows-msvc/release/WebView2Loader.dll" ]; then
            cp "src-tauri/target/x86_64-pc-windows-msvc/release/WebView2Loader.dll" "$PORTABLE_DIR/"
          fi

          touch "$PORTABLE_DIR/.portable"
          7z a "Donut_${VERSION}_x64-portable.zip" "$PORTABLE_DIR"

      - name: Create release (if missing)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

      - name: Upload portable ZIP to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" "Donut_${VERSION}_x64-portable.zip" --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    if: github.repository == 'footjobinator/donutbrowser'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS_DIR="/tmp/release-assets"
          mkdir -p "$ASSETS_DIR"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$ASSETS_DIR"
          cd "$ASSETS_DIR"
          sha256sum Donut* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

  changelog:
    if: github.repository == 'footjobinator/donutbrowser'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Generate changelog and update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          strip_prefix() { echo "$1" | sed -E 's/^[a-z]+(\([^)]*\))?: //'; }

          features=""; fixes=""; refactors=""; perf=""; docs=""; maintenance=""; other=""
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            case "$msg" in
              feat\(*\):*|feat:*)         features="${features}- $(strip_prefix "$msg")"$'\n' ;;
              fix\(*\):*|fix:*)           fixes="${fixes}- $(strip_prefix "$msg")"$'\n' ;;
              refactor\(*\):*|refactor:*) refactors="${refactors}- $(strip_prefix "$msg")"$'\n' ;;
              perf\(*\):*|perf:*)         perf="${perf}- $(strip_prefix "$msg")"$'\n' ;;
              docs\(*\):*|docs:*)         docs="${docs}- $(strip_prefix "$msg")"$'\n' ;;
              build*|ci*|chore*|test*)    maintenance="${maintenance}- ${msg}"$'\n' ;;
              *)                          other="${other}- ${msg}"$'\n' ;;
            esac
          done < <(git log --pretty=format:"%s" "${PREV_TAG}..${TAG}" --no-merges)

          {
            echo "## ${TAG} ($(date -u +%Y-%m-%d))"
            echo ""
            [ -n "$features" ]    && printf "### Features\n\n%s\n" "$features"
            [ -n "$fixes" ]       && printf "### Bug Fixes\n\n%s\n" "$fixes"
            [ -n "$refactors" ]   && printf "### Refactoring\n\n%s\n" "$refactors"
            [ -n "$perf" ]        && printf "### Performance\n\n%s\n" "$perf"
            [ -n "$docs" ]        && printf "### Documentation\n\n%s\n" "$docs"
            [ -n "$maintenance" ] && printf "### Maintenance\n\n%s\n" "$maintenance"
            [ -n "$other" ]       && printf "### Other\n\n%s\n" "$other"
          } > /tmp/release-changelog.md

          cat /tmp/release-changelog.md
          gh release edit "$TAG" --notes-file /tmp/release-changelog.md --repo "$GITHUB_REPOSITORY"
